name: GitHub Metrics

on:
  schedule:
    - cron: "23 3 * * *"   # каждый день ~06:23 МСК
  workflow_dispatch:        # ручной запуск (Actions → GitHub Metrics → Run workflow)

permissions:
  contents: write            # нужно, чтобы Action закоммитил github-metrics.svg

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: EVissI
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main

          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          plugins_errors_fatal: no

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
